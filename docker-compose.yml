services:
  postgres:
    image: postgres:16-alpine
    container_name: dpp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: ${HC_INTERVAL:-10s}
      timeout: ${HC_TIMEOUT:-5s}
      retries: ${HC_RETRIES:-5}
      start_period: 10s

  backend:
    build: .
    container_name: dpp-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    networks:
      - dpp-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-8080}/health || exit 1"]
      interval: ${HC_INTERVAL:-15s}
      timeout: ${HC_TIMEOUT:-5s}
      retries: ${HC_RETRIES:-3}
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: dpp-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/bearer_token:/etc/prometheus/bearer_token:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - dpp-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: ${HC_INTERVAL:-15s}
      timeout: ${HC_TIMEOUT:-5s}
      retries: ${HC_RETRIES:-3}
      start_period: 10s

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: dpp-node-exporter
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics || exit 1"]
      interval: ${HC_INTERVAL:-15s}
      timeout: ${HC_TIMEOUT:-5s}
      retries: ${HC_RETRIES:-3}
      start_period: 5s

  loki:
    image: grafana/loki:latest
    container_name: dpp-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - dpp-network
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: ${HC_INTERVAL:-15s}
      timeout: ${HC_TIMEOUT:-5s}
      retries: ${HC_RETRIES:-3}
      start_period: 10s

  promtail:
    image: grafana/promtail:latest
    container_name: dpp-promtail
    restart: unless-stopped
    user: root
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dpp-network
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:10.4.2
    container_name: dpp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - dpp-network
    depends_on:
      backend:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: ${HC_INTERVAL:-15s}
      timeout: ${HC_TIMEOUT:-5s}
      retries: ${HC_RETRIES:-3}
      start_period: 15s

networks:
  dpp-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
